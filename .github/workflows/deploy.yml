name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ to the gh-pages branch on every push
# to main. Supabase credentials are injected at build time from repo secrets so
# deploys never depend on a local .env file.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL   e.g. https://YOUR_PROJECT.supabase.co
#   VITE_SUPABASE_ANON  the public anon/publishable key (RLS-protected)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow the workflow to push to the gh-pages branch.
permissions:
  contents: write

# Avoid overlapping deploys.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON: ${{ secrets.VITE_SUPABASE_ANON }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON" ]; then
            echo "::error::Missing VITE_SUPABASE_URL / VITE_SUPABASE_ANON repo secrets — the build would ship without Supabase credentials and break sign-in."
            exit 1
          fi
          npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
